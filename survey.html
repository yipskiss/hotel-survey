<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hotel Space Evaluation Survey</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #333;
            --muted: #888;
            --border: #e0e0e0;
            --likert-hover: #eaf4fc;
            --likert-selected: #3498db;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }
        body.split-mode {
            overflow: hidden;
            height: 100vh;
        }

        /* ── Top bar ── */
        .topbar {
            background: var(--primary);
            color: #fff;
            padding: 14px 24px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 200;
        }
        .topbar .progress-text { font-size: 13px; opacity: 0.8; }
        .progress-bar-bg {
            height: 4px; background: rgba(255,255,255,0.2);
            border-radius: 2px; width: 200px;
        }
        .progress-bar-fill {
            height: 100%; background: #2ecc71;
            border-radius: 2px; transition: width 0.4s;
        }

        /* ── Page container ── */
        .page { display: none; max-width: 900px; margin: 0 auto; padding: 32px 20px 80px; overflow-x: hidden; }
        .page.active { display: block; }

        /* ── Cards ── */
        .card {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 28px;
            margin-bottom: 24px;
        }
        .card h2 { font-size: 20px; margin-bottom: 16px; color: var(--primary); }
        .card p { font-size: 14px; color: #555; margin-bottom: 16px; }

        /* ── 360° Viewer ── */
        .viewer-section {
            position: fixed;
            top: 52px;
            left: 0; right: 0;
            z-index: 100;
            background: var(--bg);
            padding: 8px 20px;
            display: none;
        }
        .viewer-section.active { display: block; }
        .viewer-section .card {
            max-width: 900px;
            margin: 0 auto;
            padding: 12px 16px;
            margin-bottom: 0;
        }
        .viewer-section h2 { font-size: 16px; margin-bottom: 6px; }
        .viewer-section p { font-size: 12px; margin-bottom: 8px; }
        .viewer-wrap {
            width: 100%;
            height: 506px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .viewer-wrap .pnlm-controls-container { display: none !important; }
        .has-viewer { padding-top: 620px !important; }

        /* ── Split-screen mode (hotel pages) ── */
        body.split-mode .viewer-section.active {
            top: 52px;
            bottom: auto;
            height: calc(50vh - 26px);
            padding: 6px 20px;
            overflow: hidden;
        }
        body.split-mode .viewer-section .card {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 8px 16px;
        }
        body.split-mode .viewer-wrap {
            height: 100% !important;
            flex: 1;
            min-height: 0;
        }
        body.split-mode .page.has-viewer {
            position: fixed;
            top: calc(50vh + 26px);
            left: 0; right: 0;
            bottom: 60px;
            overflow-y: auto;
            padding: 16px 20px 20px !important;
            max-width: 100%;
            margin: 0;
        }
        body.split-mode .page.has-viewer .card {
            max-width: 900px;
            margin: 0 auto 16px;
        }

        /* ── Likert ── */
        .dimension-group {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .dimension-group:last-child { border-bottom: none; }
        .dim-label {
            font-size: 15px; font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
        }
        .question-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 16px;
            padding: 10px 0;
        }
        .question-text { font-size: 14px; }
        .likert-scale {
            display: flex; gap: 6px; align-items: center;
            flex-wrap: nowrap;
            max-width: 100%;
        }
        .likert-scale .anchor { font-size: 11px; color: var(--muted); min-width: 60px; text-align: center; }
        .likert-scale .anchor:first-child { text-align: right; }
        .likert-scale .anchor:last-child { text-align: left; }
        .likert-mobile-label {
            display: none;
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin-bottom: 4px;
        }
        .likert-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: #fff;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 13px;
            color: var(--muted);
            display: flex; align-items: center; justify-content: center;
        }
        .likert-btn:hover { border-color: var(--accent); background: var(--likert-hover); }
        .likert-btn.selected {
            border-color: var(--likert-selected);
            background: var(--likert-selected);
            color: #fff;
        }

        /* ── Form inputs ── */
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 14px; font-weight: 600;
            margin-bottom: 6px; color: var(--primary);
        }
        .form-group select, .form-group input {
            width: 100%; padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px;
            background: #fff;
        }
        .form-group select:focus, .form-group input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(52,152,219,0.15);
        }

        /* ── WTP ── */
        .wtp-input {
            display: flex; align-items: center; gap: 8px;
        }
        .wtp-input span { font-size: 20px; font-weight: 600; color: var(--primary); }
        .wtp-input input {
            width: 160px; padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px; font-size: 18px; text-align: center;
        }

        /* ── Navigation ── */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #fff;
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex; justify-content: center; gap: 16px;
            z-index: 200;
        }
        .nav-btn {
            padding: 12px 40px;
            border-radius: 8px;
            font-size: 15px; font-weight: 600;
            cursor: pointer; border: none;
            transition: all 0.2s;
        }
        .btn-next { background: var(--accent); color: #fff; }
        .btn-next:hover { background: #2980b9; }
        .btn-back { background: #ecf0f1; color: var(--primary); }
        .btn-back:hover { background: #d5dbdb; }
        .btn-next:disabled { background: #bdc3c7; cursor: not-allowed; }

        /* ── Consent ── */
        .consent-box {
            background: #fafafa; border: 1px solid var(--border);
            border-radius: 8px; padding: 20px;
            max-height: 300px; overflow-y: auto;
            font-size: 13px; color: #555;
            margin-bottom: 16px;
        }
        .consent-check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .consent-check input { width: 18px; height: 18px; }

        /* ── Completion ── */
        .completion-code {
            background: #f0faf0; border: 2px solid #2ecc71;
            border-radius: 10px; padding: 24px;
            text-align: center; font-size: 24px;
            font-weight: 700; letter-spacing: 4px;
            color: #27ae60;
        }

        /* ── Validation warning ── */
        .warning { color: #e74c3c; font-size: 13px; margin-top: 4px; display: none; }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .question-row {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .viewer-wrap { height: 200px; }
            .viewer-section { padding: 6px 12px; }
            .viewer-section .card { padding: 8px 12px; }
            .viewer-section h2 { font-size: 14px; }
            .viewer-section p { font-size: 11px; margin-bottom: 6px; }
            .has-viewer { padding-top: 300px !important; }
            body.split-mode .viewer-section.active {
                height: calc(40vh - 26px);
            }
            body.split-mode .page.has-viewer {
                top: calc(40vh + 26px);
                padding: 12px 12px 16px !important;
            }
            .likert-scale {
                justify-content: center;
                gap: 4px;
            }
            .likert-scale .anchor { display: none; }
            .likert-mobile-label { display: block; }
            .likert-btn {
                width: 36px; height: 36px; font-size: 13px;
            }
            .page { padding: 16px 12px 80px; }
            .card { padding: 16px; }
            .dimension-group { margin-bottom: 20px; padding-bottom: 14px; }
            .dim-label { font-size: 14px; }
            .question-text { font-size: 13px; }
        }
    </style>
</head>

<!-- ═══ TOP BAR ═══ -->
<div class="topbar">

        <div class="viewer-wrap" id="viewerPano"></div>
    </div>
</div>

<!-- ═══ PAGES CONTAINER ═══ -->
<div id="pagesContainer"></div>

<!-- ═══ NAVIGATION ═══ -->
<div class="nav-bar">
    <button class="nav-btn btn-back" id="btnBack" onclick="prevPage()">Back</button>
    <button class="nav-btn btn-next" id="btnNext" onclick="nextPage()">Next</button>
</div>

function checkScreening() {
    const birthYear = parseInt(document.getElementById('demo_birthyear')?.value);
    const gender = document.getElementById('demo_gender')?.value;
    const purpose = document.getElementById('demo_purpose')?.value;
    const failEl = document.getElementById('screeningFail');
    const reasonEl = document.getElementById('screeningFailReason');

    if (!failEl) return;

    let fail = false;
    let reason = '';

    // Check generation: Gen Z (1997-2008, age 18-29) or Gen X (1965-1980, age 46-61)
    if (birthYear) {
        const isGenZ = birthYear >= 1997 && birthYear <= 2008;
        const isGenX = birthYear >= 1965 && birthYear <= 1980;
        if (!isGenZ && !isGenX) {
            fail = true;
            reason = 'This study requires participants from Generation Z (born 1997–2008) or Generation X (born 1965–1980).';
        } else {
            participantGeneration = isGenZ ? 'Gen Z' : 'Gen X';
        }
    }

    // Store purpose
    if (purpose) {
        participantPurpose = purpose;
        responses['_travelPurpose'] = purpose;
    }

    // Store generation
    if (participantGeneration) {
        responses['_generation'] = participantGeneration;
    }
    if (birthYear) {
        responses['_birthYear'] = birthYear;
    }
    if (gender) {
        responses['_gender'] = gender;
    }

    screenedOut = fail;
    failEl.style.display = fail ? 'block' : 'none';
    if (reasonEl) reasonEl.textContent = reason;
}

function shuffleArray(arr) {
    const shuffled = [...arr];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
}

function assignGroupAndHotels() {
    // 1. 랜덤 그룹 배정 (A~E)
    const groupKeys = Object.keys(CONFIG.groups);
    assignedGroup = groupKeys[Math.floor(Math.random() * groupKeys.length)];
    const indices = CONFIG.groups[assignedGroup];

    // 2. 배정된 그룹의 호텔 수집 (등급당 2개 = 10개)
    const tiers = Object.keys(CONFIG.allHotels);
    let hotels = [];
    tiers.forEach(tier => {
        indices.forEach(idx => {
            const hotel = CONFIG.allHotels[tier][idx];
            hotels.push({ ...hotel, tier: tier });
        });
    });

    // 3. 10개 호텔 순서 랜덤화 (순서효과 방지)
    assignedHotels = shuffleArray(hotels);

    // 4. 메타데이터 기록
    responses['_participantId'] = participantId;
    responses['_assignedGroup'] = assignedGroup;
    responses['_hotelOrder'] = assignedHotels.map(h => h.id).join(',');
    responses['_timestamp'] = new Date().toISOString();

    console.log(`[Survey] Group: ${assignedGroup}, Hotels: ${assignedHotels.map(h=>h.id).join(', ')}`);
}

let activeViewer = null;
let currentViewerImage = null;

function initViewer(pageEl) {
    const imageFile = pageEl.dataset.viewerImage;
    const label = pageEl.dataset.viewerLabel;
    const space = pageEl.dataset.space;
    if (!imageFile) return;

    const fixedViewer = document.getElementById('fixedViewer');
    const viewerPano = document.getElementById('viewerPano');
    const viewerTitle = document.getElementById('viewerTitle');
    const viewerBadge = document.getElementById('viewerBadge');

    // Show fixed viewer
    fixedViewer.classList.add('active');
    document.body.classList.add('split-mode');
    viewerTitle.textContent = label;

    // Badge: Lobby = blue, Room = green
    if (space === 'lobby') {
        viewerBadge.textContent = '🏛 Lobby';
        viewerBadge.style.background = '#3498db';
    } else {
        viewerBadge.textContent = '🛏 Room';
        viewerBadge.style.background = '#2ecc71';
    }

    // Only re-init if different image
    if (currentViewerImage === imageFile) return;
    currentViewerImage = imageFile;

    // Destroy previous viewer
    if (activeViewer) {
        activeViewer.destroy();
        activeViewer = null;
    }

    activeViewer = pannellum.viewer('viewerPano', {
        type: 'equirectangular',
        panorama: imageFile,
        autoLoad: true,
        hfov: 100, minHfov: 100, maxHfov: 100,
        minPitch: -60, maxPitch: 60,
        pitch: 0, yaw: 0,
        autoRotate: false,
        showZoomCtrl: false, showFullscreenCtrl: false,
        mouseZoom: false,
        friction: 0.3, yawSpeed: 1, pitchSpeed: 1,
        compass: false,
        strings: { loadingLabel: "Loading..." }
    });
}

function hideViewer() {
    document.getElementById('fixedViewer').classList.remove('active');
    document.body.classList.remove('split-mode');
}

// ============================================================
// PAGE NAVIGATION
// ============================================================

function showPage(idx) {
    document.querySelectorAll('.page').forEach(p => {
        p.classList.remove('active');
        p.scrollTop = 0;
    });
    const page = document.querySelector(`.page[data-page="${idx}"]`);
    if (page) {
        page.classList.add('active');
        window.scrollTo(0, 0);
        page.scrollTop = 0;

        // Inject travel purpose into scenario framing
        page.querySelectorAll('.scenario-purpose').forEach(el => {
            el.textContent = participantPurpose ? participantPurpose.toLowerCase() : '___';
        });

        // Show/hide fixed viewer based on page type
        if (page.classList.contains('has-viewer')) {
            setTimeout(() => initViewer(page), 100);
        } else {
            hideViewer();
        }
    }

    currentPage = idx;
    updateNav();
    updateProgress();
}

function nextPage() {
    if (currentPage === totalPages - 2) {
        // Last content page → submit → show completion
        submitData();
        showPage(currentPage + 1);
        return;
    }
    if (currentPage < totalPages - 1) {
        showPage(currentPage + 1);
    }
}

function prevPage() {
    if (currentPage > 0) showPage(currentPage - 1);
}

function updateNav() {
    const backBtn = document.getElementById('btnBack');
    const nextBtn = document.getElementById('btnNext');

    backBtn.style.display = currentPage === 0 ? 'none' : 'inline-block';

    if (currentPage === totalPages - 1) {
        // Completion page
        nextBtn.style.display = 'none';
        backBtn.style.display = 'none';
    } else if (currentPage === totalPages - 2) {
        nextBtn.textContent = 'Submit';
    } else {
        nextBtn.textContent = 'Next';
    }

    // Validation
    nextBtn.disabled = !isPageValid(currentPage);
}

function isPageValid(idx) {
    const page = document.querySelector(`.page[data-page="${idx}"]`);
    if (!page) return false;

    // Consent page
    const consent = page.querySelector('#consentCheck');
    if (consent) return consent.checked;

    // Demographics page — all fields filled AND not screened out
    const selects = page.querySelectorAll('select');
    if (selects.length > 0 && !page.dataset.hotel) {
        const allFilled = Array.from(selects).every(s => s.value !== '');
        return allFilled && !screenedOut;
    }

    // Hotel pages — all likert answered + WTP (if room)
    const likerts = page.querySelectorAll('.likert-scale');
    if (likerts.length > 0) {
        const allLikert = Array.from(likerts).every(ls => ls.querySelector('.selected'));
        const wtpSelect = page.querySelector('select[id*="_WTP"]');
        if (wtpSelect) {
            return allLikert && wtpSelect.value !== '';
        }
        return allLikert;
    }

    return true;
}

function updateProgress() {
    const pct = Math.round((currentPage / (totalPages - 1)) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `Page ${currentPage + 1} / ${totalPages}`;
}

// ============================================================
// DATA SUBMISSION
// ============================================================

function collectAllData() {
    // Demographics
    const demo = {
        birthYear: document.getElementById('demo_birthyear')?.value || '',
        generation: participantGeneration,
        gender: document.getElementById('demo_gender')?.value || '',
        frequency: document.getElementById('demo_frequency')?.value || '',
        travelPurpose: participantPurpose,
    };

    return {
        participantId,
        assignedGroup,
        hotelOrder: assignedHotels.map(h => h.id).join(','),
        timestamp: new Date().toISOString(),
        demographics: demo,
        responses: { ...responses },
    };
}

function submitData() {
    const data = collectAllData();
    console.log('Survey data:', JSON.stringify(data, null, 2));

    // Generate completion code
    const code = 'C' + Math.random().toString(36).substr(2, 8).toUpperCase();
    document.getElementById('completionCode').textContent = code;

    // Send to Google Sheets (if URL configured)
    if (CONFIG.googleSheetsUrl) {
        fetch(CONFIG.googleSheetsUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
        }).catch(err => console.error('Submit error:', err));
    }

    // Redirect to Prolific (if configured)
    if (CONFIG.prolificReturnUrl) {
        setTimeout(() => {
            window.location.href = CONFIG.prolificReturnUrl + '?cc=' + code;
        }, 5000);
    }
}

// ============================================================
// INIT
// ============================================================

buildAllPages();
</script>
